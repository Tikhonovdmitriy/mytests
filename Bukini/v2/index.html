<!DOCTYPE html>
<html lang="ru">
<head>
      <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }

        /*
         * Фоновый постер уже обернут в ссылку Adfox,
         * но до завершения оттаивания ссылка НЕ кликабельна.
         */
        #backgroundLink {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
            pointer-events: none;
            cursor: default;
            text-decoration: none;
        }

        /*
         * Отдельный кликовый слой AdFox.
         * До окончания оттаивания он полностью отключен.
         * После полного завершения оттаивания поднимается поверх постера и принимает тап/клик.
         */
        #adfoxClickLayer {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: none;
            pointer-events: none;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #adfoxClickLayer.is-active {
            display: block;
            pointer-events: auto;
        }

        #posterBackground {
            position: absolute;
            inset: 0;
            background: url('poster.jpg') no-repeat center center;
            background-size: cover;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
            user-select: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7);
        }

        #frostCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        /*
         * Мобильный CTA 150x150.
         * Сюда потом можно вставить свою картинку внутрь #mobileCta.
         * pointer-events:none нужен, чтобы квадрат не мешал жесту протирания.
         */
        #mobileCta {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            width: 180px;
            height: 245px;
            transform: translate(-50%, -50%);
            z-index: 10000;
           pointer-events: none;
            opacity: 1;
            transition: opacity 0.2s ease;
            overflow: hidden;
        }

        #mobileCta img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #mobileCta.is-hidden {
            opacity: 0;
            visibility: hidden;
        }

        @media (hover: none) and (pointer: coarse) {
            #mobileCta {
                display: block;
            }
        }
    </style>
</head>

<body>

    <!--
        Основной клик AdFox выполняется по ТТ через:
        parent.postMessage('banner.redirect', '*');
        До полного завершения оттаивания кликовая область заблокирована.
    -->
    <div id="backgroundLink">
        <div id="posterBackground"></div>
    </div>

    <!--
        Клик AdFox строго по ТТ.
        Слой активируется только после полного завершения оттаивания.
    -->
    <div
        id="adfoxClickLayer"
        onclick="posterClick();"
        aria-hidden="true"
    ></div>

    <!-- Мобильный белый CTA 150x150. Вставь сюда картинку, когда будет готова. -->
    <div id="mobileCta">
         <img src="cta.png" alt="Начни протирать экран">  
    </div>

    <canvas id="frostCanvas"></canvas>

    <script>
        const canvas = document.getElementById('frostCanvas');
        const ctx = canvas.getContext('2d');

        const backgroundLink = document.getElementById('backgroundLink');
        const adfoxClickLayer = document.getElementById('adfoxClickLayer');
        const mobileCta = document.getElementById('mobileCta');

        // ==============================
        // ТЕСТ КЛИКА / БОЕВОЙ РЕЖИМ ADFOX
        // ==============================
        // true  = после оттаивания открывается TEST_URL
        // false = после оттаивания отправляется штатный AdFox redirect
        const TEST_MODE = false;
        const TEST_URL = 'https://tnt-online.ru';

        function posterClick() {
            if (TEST_MODE) {
                window.open(TEST_URL, '_blank');
            } else {
                parent.postMessage('banner.redirect', '*');
            }
        }

        function activatePosterLink() {
            // После финала перестаем подавлять мобильные жесты,
            // чтобы iOS/Android гарантированно сформировали обычный tap/click.
            document.documentElement.style.touchAction = 'auto';
            document.body.style.touchAction = 'auto';

            // Активируем отдельный верхний слой с onclick строго по ТТ AdFox.
            adfoxClickLayer.classList.add('is-active');
            adfoxClickLayer.setAttribute('aria-hidden', 'false');
        }

        function hideMobileCta() {
            if (mobileCta && !mobileCta.classList.contains('is-hidden')) {
                mobileCta.classList.add('is-hidden');
            }
        }

        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d');

        const frostImage = new Image();
        frostImage.src = 'frost.png';
        let imgLoaded = false;
        frostImage.onload = () => {
            imgLoaded = true;
            draw();
        };

        // НАСТРОЙКИ ЭФФЕКТА
        const BRUSH_RADIUS = 120;
        const THRESHOLD_PERCENT = 45;
        const AUTO_MELT_SPEED = 0.5;

        let isThawed = false;
        let isFinalThawing = false;
        let lastCheckTime = 0;

        // Переменные для управления ускорением
        let finalThawStartTime = 0;
        const INITIAL_FINAL_SPEED = 12; // Начальная скорость финального таяния

        function getCoverCoords(imgW, imgH, containerW, containerH) {
            const imgRatio = imgW / imgH;
            const containerRatio = containerW / containerH;
            let startX = 0, startY = 0, renderW = containerW, renderH = containerH;

            if (containerRatio > imgRatio) {
                renderH = containerW / imgRatio;
                startY = (containerH - renderH) / 2;
            } else {
                renderW = containerH * imgRatio;
                startX = (containerW - renderW) / 2;
            }
            return { x: startX, y: startY, w: renderW, h: renderH };
        }

        function resizeCanvas() {
            if (isThawed) return;
            const width = window.innerWidth;
            const height = window.innerHeight;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = maskCanvas.width;
            tempCanvas.height = maskCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(maskCanvas, 0, 0);

            canvas.width = width;
            canvas.height = height;
            maskCanvas.width = width;
            maskCanvas.height = height;

            maskCtx.clearRect(0, 0, width, height);
            maskCtx.drawImage(tempCanvas, 0, 0);

            draw();
        }

        function checkMeltPercentage() {
            if (isThawed || isFinalThawing) return;

            const imgData = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
            const data = imgData.data;
            let clearedPixels = 0;

            for (let i = 3; i < data.length; i += 128) {
                if (data[i] > 100) {
                    clearedPixels++;
                }
            }

            const totalSampledPixels = data.length / 128;
            const percentage = (clearedPixels / totalSampledPixels) * 100;

            if (percentage >= THRESHOLD_PERCENT) {
                startSmoothFinalThaw();
            }
        }

        function startSmoothFinalThaw() {
            isFinalThawing = true;
            finalThawStartTime = performance.now(); // Запоминаем точное время старта финала
            smoothFinalThaw(performance.now());
        }

        // Анимационный цикл прогрессирующего финального таяния
        function smoothFinalThaw(currentTime) {
            if (isThawed) return;

            // Вычисляем, сколько секунд прошло с момента старта финала
            const timePassedInSeconds = (currentTime - finalThawStartTime) / 700;

            maskCtx.save();
            maskCtx.globalCompositeOperation = 'source-over';

            // Степень размытия увеличивается по мере ускорения таяния
            maskCtx.globalAlpha = 0.35;
            maskCtx.filter = 'blur(3px)';

            // Расчет прогрессирующей скорости: стартует с 12 и лавинообразно растет в течение 2 секунд
            // Формула увеличивает скорость быстрее к концу отведенного времени
            const accelerationFactor = Math.pow(timePassedInSeconds / 2, 2) * 50;
            const dynamicSpeed = INITIAL_FINAL_SPEED + accelerationFactor;

            maskCtx.drawImage(
                maskCanvas,
                -dynamicSpeed,
                -dynamicSpeed,
                maskCanvas.width + (dynamicSpeed * 2),
                maskCanvas.height + (dynamicSpeed * 2)
            );
            maskCtx.restore();

            draw();

            // Если 2 секунды истекли или лед полностью сошел по расчетам пикселей
            if (timePassedInSeconds >= 2) {
                isThawed = true;

                // Мягко подчищаем остатки заливкой на 100%
                maskCtx.fillStyle = 'rgba(0, 0, 0, 1.0)';
                maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
                draw();

                canvas.style.opacity = '0';

                setTimeout(() => {
                    canvas.remove();

                    // Полностью снимаем мобильные обработчики протирания до включения клика.
                    window.removeEventListener('touchstart', onTouchStart, { passive: false });
                    window.removeEventListener('touchmove', onTouchMove, { passive: false });

                    // Клик становится активным сразу после полного завершения оттаивания.
                    activatePosterLink();
                }, 500);
            } else {
                requestAnimationFrame(smoothFinalThaw);
            }
        }

        function melt(x, y) {
            if (isThawed || isFinalThawing) return;

            let gradient = maskCtx.createRadialGradient(x, y, 0, x, y, BRUSH_RADIUS);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
            gradient.addColorStop(0.1, 'rgba(0, 0, 0, 0.5)');
            gradient.addColorStop(0.4, 'rgba(0, 0, 0, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.0)');

            maskCtx.save();
            maskCtx.fillStyle = gradient;
            maskCtx.globalCompositeOperation = 'source-over';
            maskCtx.beginPath();
            maskCtx.arc(x, y, BRUSH_RADIUS, 0, Math.PI * 2);
            maskCtx.fill();
            maskCtx.restore();

            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (imgLoaded) {
                const coords = getCoverCoords(frostImage.width, frostImage.height, canvas.width, canvas.height);
                ctx.drawImage(frostImage, coords.x, coords.y, coords.w, coords.h);
            } else {
                ctx.fillStyle = 'rgba(235, 245, 255, 0.96)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.globalCompositeOperation = 'destination-out';
            ctx.drawImage(maskCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
        }

        function update(currentTime) {
            if (isThawed || isFinalThawing) return;

            maskCtx.save();
            maskCtx.globalCompositeOperation = 'source-over';
            maskCtx.globalAlpha = 0.35;
            maskCtx.filter = 'blur(3px)';

            maskCtx.drawImage(
                maskCanvas,
                -AUTO_MELT_SPEED,
                -AUTO_MELT_SPEED,
                maskCanvas.width + (AUTO_MELT_SPEED * 2),
                maskCanvas.height + (AUTO_MELT_SPEED * 2)
            );
            maskCtx.restore();

            draw();

            if (currentTime - lastCheckTime > 300) {
                checkMeltPercentage();
                lastCheckTime = currentTime;
            }

            requestAnimationFrame(update);
        }

        window.addEventListener('mousemove', (e) => {
            melt(e.clientX, e.clientY);
        });

        // Пока лед активен, эти обработчики управляют протиранием.
        // После финального оттаивания мы полностью снимаем их, чтобы они никак не могли
        // подавить tap/click по активированному AdFox-слою на мобильном.
        function onTouchStart(e) {
            if (isThawed) return;

            hideMobileCta();

            if (e.touches.length > 0) {
                const touch = e.touches[0];
                e.preventDefault();
                melt(touch.clientX, touch.clientY);
            }
        }

        function onTouchMove(e) {
            if (isThawed) return;

            if (e.touches.length > 0) {
                const touch = e.touches[0];
                e.preventDefault();
                melt(touch.clientX, touch.clientY);
            }
        }

        window.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('touchmove', onTouchMove, { passive: false });

        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        requestAnimationFrame(update);
    </script>

</body>
</html>
